name: Cryptographic Artifact Attestation and SLSA Provenance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required to mint the Sigstore/OIDC identity used to sign
  attestations: write  # required to publish the attestation to this repo
  packages: write
jobs:
  build-sign-and-attest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies and run tests
        run: |
          npm ci
        #   npm test

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        id: push

        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/solar-system:${{ github.sha }}

      - name: Generate SLSA build provenance attestation for the image
         
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/${{ github.repository }}/solar-system
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # - name: Build a source tarball artifact for attestation demo
      #   run: tar -czf solar-system-src.tar.gz --exclude=node_modules --exclude=.git .

      # - name: Attest a plain build artifact (non-container example)
      #   uses: actions/attest-build-provenance@v1
      #   with:
      #     subject-path: 'solar-system-src.tar.gz'

      # - name: Upload artifact and its provenance
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: solar-system-src-with-provenance
      #     path: solar-system-src.tar.gz

  verify-attestation:
    needs: build-sign-and-attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: read
    steps:
      - name: Verify container image provenance with GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh attestation verify \
            oci://ghcr.io/${{ github.repository }}/solar-system:${{ github.sha }} \
            --owner ${{ github.repository_owner }}
