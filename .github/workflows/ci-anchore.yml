name: CI with YAML Anchors and Aliases

# ---------------------------------------------------------------------------
# Verified against GitHub's official docs (Reusing workflow configurations >
# YAML anchors and aliases), current as of the Sept 18, 2025 GA of anchor
# support. Two hard rules from that page, both load-bearing for this file:
#
#   1. Anchors must be defined at their first REAL use under a key GitHub's
#      schema already recognizes (env:, steps:, or a whole job). There is
#      NO supported way to declare a separate "anchors:" or ".anchors:"
#      block anywhere in the file - any such top-level key is rejected with
#      "Unexpected value '<key>'" before the workflow even runs.
#   2. Merge keys ("<<:") are NOT supported, at all. GitHub's parser will
#      reject them. An alias always substitutes the ENTIRE anchored node
#      (a full env map, a full steps list, or a full job) - never a partial
#      merge with overrides on top.
# ---------------------------------------------------------------------------

on:
  push:
    branches:
      # Anchored here and reused on pull_request below - a small, safe,
      # officially-demonstrated pattern for keeping trigger filters in sync.
      - &main_branch main
  pull_request:
    branches:
      - *main_branch

jobs:
  unit-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Anchor the entire env map on first use.
    env: &default_env
      NODE_ENV: test
      MONGO_URI: mongodb+srv://supercluster.d83jj.mongodb.net/superData
      MONGO_USERNAME: superuser
      MONGO_PASSWORD: SuperPassword
    # Anchor the entire steps list on first use.
    steps: &common_steps
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test

  code-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reuse the whole env map exactly as-is (no overrides possible - that
    # would require merge keys, which GitHub does not support).
    env: *default_env
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run code coverage
        run: npm run coverage
        continue-on-error: true
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage
          retention-days: 5

  lint-using-anchored-steps:
    # This job has NO steps of its own written out - it reuses the entire
    # &common_steps list from unit-testing verbatim, demonstrating that a
    # full steps SEQUENCE can be aliased wholesale (just not merged/extended).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps: *common_steps
