name: Advanced Matrix Management and Troubleshooting Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  matrix-tests:
    strategy:
      # fail-fast: false lets every matrix combination finish (and be
      # individually rerun later) instead of GitHub cancelling the rest of
      # the matrix the moment one combination fails.
      fail-fast: false
      max-parallel: 3
      matrix:
        node-version: [18, 20, 22]
        os: [ubuntu-latest, windows-latest]
        include:
          - node-version: 20
            os: ubuntu-latest
            coverage: true
        exclude:
          - node-version: 18
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run coverage (only on the flagged matrix entry)
        if: matrix.coverage == true
        run: npm run coverage

  # ---------------------------------------------------------------------------
  # TROUBLESHOOTING NOTES (teaching reference, not executable steps):
  #
  # 1. Rerunning a single failed matrix job:
  #    In the Actions UI, open the failed run -> click the failed job in the
  #    matrix (e.g. "matrix-tests (20, windows-latest)") -> "Re-run jobs" ->
  #    "Re-run failed jobs". Only that specific matrix combination re-executes;
  #    the passing combinations are left untouched. Equivalent CLI command:
  #      gh run rerun <run-id> --job <job-id> --failed
  #
  # 2. Expanding YAML aliases during diagnostics:
  #    The workflow file GitHub shows you in the UI/logs is the raw source,
  #    aliases and all - it does NOT show the expanded/merged form. To see
  #    what an anchor/alias actually expands to before pushing, expand it
  #    locally first:
  #      python3 -c "import yaml,sys; print(yaml.safe_load(open('this.yml')))"
  #    or with yq:
  #      yq eval '.jobs.matrix-tests.steps' .github/workflows/matrix-troubleshooting.yml
  #    Remember GitHub Actions anchors do NOT support merge keys ("<<:"), so
  #    an alias always expands to the ENTIRE anchored node, never a partial
  #    override on top of it.
  #
  # 3. Disabling vs. Deleting a workflow:
  #    - Disable (Actions tab -> select workflow -> "..." -> "Disable workflow",
  #      or `gh workflow disable matrix-troubleshooting.yml`): the .yml file,
  #      its full run history, and logs are preserved. It stops triggering on
  #      new events but can be re-enabled instantly with
  #      `gh workflow enable matrix-troubleshooting.yml`. Use this for
  #      temporary pauses (e.g. a flaky external dependency).
  #    - Delete: removing the .yml file from the repo (via a commit/PR) stops
  #      the workflow from running for NEW events, but existing run history
  #      remains visible in the Actions tab until the repository itself
  #      purges it. There is no one-click "undelete" - you must re-add the
  #      file via a new commit to bring the workflow back. Use this only when
  #      the workflow is permanently retired.
  # ---------------------------------------------------------------------------
  troubleshooting-reference:
    runs-on: ubuntu-latest
    needs: matrix-tests
    if: always()
    steps:
      - name: Print troubleshooting cheatsheet to the job summary
        run: |
          {
            echo "## Matrix Troubleshooting Cheatsheet"
            echo ""
            echo "| Task | Command |"
            echo "| --- | --- |"
            echo "| Rerun only failed matrix jobs | \`gh run rerun ${{ github.run_id }} --failed\` |"
            echo "| Rerun one specific job | \`gh run rerun ${{ github.run_id }} --job <job-id>\` |"
            echo "| Disable this workflow | \`gh workflow disable matrix-troubleshooting.yml\` |"
            echo "| Re-enable this workflow | \`gh workflow enable matrix-troubleshooting.yml\` |"
            echo "| List runs for this workflow | \`gh run list --workflow matrix-troubleshooting.yml\` |"
          } >> "$GITHUB_STEP_SUMMARY"
