name: Least-Privilege GITHUB_TOKEN Scoping Demo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ---------------------------------------------------------------------------
# Workflow-level default: deny everything unless a job explicitly requests
# more. This is the recommended starting posture for every workflow.
# ---------------------------------------------------------------------------
permissions: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # This job only needs to read repository contents to check out code and
    # run tests. It does not push commits, comment on PRs, or touch packages.
    permissions:
      contents: read
    env: 
      NODE_ENV: test
      MONGO_URI: mongodb+srv://supercluster.d83jj.mongodb.net/superData
      MONGO_USERNAME: superuser
      MONGO_PASSWORD: SuperPassword
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  comment-on-pull-request:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # This job additionally needs write access to pull-requests to post a
    # status comment, and read access to contents to check out the repo.
    # It does NOT get "packages: write", "actions: write", or "issues: write"
    # because it never uses them.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Comment build result on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Build and unit tests passed for commit ' + context.sha.substring(0, 7) + '.'
            });

  publish-container-image:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    # This job needs to push an image to GHCR, so it needs "packages: write".
    # It intentionally does NOT get "contents: write" - it reads code, it
    # never pushes commits or tags back to the repository.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/solar-system:${{ github.sha }}
